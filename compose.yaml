services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/meshai}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:?NEBIUS_API_KEY is required}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./client
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  uploads_data:
  caddy_data:
  caddy_config:
